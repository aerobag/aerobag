  "2012-2016 Apps4Av Inc.",
  "2026 Aerobag contributors",
]
SPDX-License-Identifier = "LicenseRef-Apps4Av AND AGPL-3.0-or-later"

[[annotations]]
path = [
  "product/chart-metadata/TAC/Grand Canyon General Aviation.geojson",
  "product/chart-metadata/TAC/Honolulu Inset SEC.geojson",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Aerobag contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
