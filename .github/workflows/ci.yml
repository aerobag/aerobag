name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1
  RUSTUP_TOOLCHAIN: 1.94.1
  NEXTEST_VERSION: 0.9.140

jobs:
  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Check shared crates
        run: cargo +"$RUST_TOOLCHAIN" fmt --manifest-path crates/Cargo.toml --all --check
      - name: Check application core
        run: cargo +"$RUST_TOOLCHAIN" fmt --manifest-path ui/core-rust/Cargo.toml --all --check
      - name: Check preprocessors
        run: cargo +"$RUST_TOOLCHAIN" fmt --manifest-path product/preprocessor/Cargo.toml --all --check

  rust-shared:
    name: Rust shared crates
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/cargo-target/shared
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci/cargo-target/shared
          key: rust-shared-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('crates/Cargo.lock') }}
      - name: Run shared crate tests
        id: tests
        continue-on-error: true
        working-directory: crates
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo nextest run --workspace --profile ci
      - name: Run shared crate doctests
        id: doctests
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: crates
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --workspace --doc
      - name: Report individual tests
        if: ${{ always() }}
        run: python3 tools/ci/junit_summary.py --title "Rust shared crates" "crates/target/nextest/ci/junit.xml"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-shared-test-results
          path: crates/target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce test results
        if: ${{ steps.tests.outcome == 'failure' || steps.doctests.outcome == 'failure' }}
        run: exit 1

  rust-core:
    name: Rust application core
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/cargo-target/core
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci/cargo-target/core
          key: rust-core-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/core-rust/Cargo.lock') }}
      - name: Run fixture-free core tests
        id: tests
        continue-on-error: true
        working-directory: ui/core-rust
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          AEROBAG_ARTIFACT_READ_PATH: ${{ runner.temp }}/aerobag-no-artifacts
        run: cargo nextest run --workspace --profile ci
      - name: Run core doctests
        id: doctests
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: ui/core-rust
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          AEROBAG_ARTIFACT_READ_PATH: ${{ runner.temp }}/aerobag-no-artifacts
        run: cargo test --workspace --doc
      - name: Report individual tests
        if: ${{ always() }}
        run: python3 tools/ci/junit_summary.py --title "Rust application core" "ui/core-rust/target/nextest/ci/junit.xml"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-core-test-results
          path: ui/core-rust/target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce test results
        if: ${{ steps.tests.outcome == 'failure' || steps.doctests.outcome == 'failure' }}
        run: exit 1

  rust-preprocessor:
    name: Rust preprocessors
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/cargo-target/preprocessor
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install cargo-nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci/cargo-target/preprocessor
          key: rust-preprocessor-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('product/preprocessor/Cargo.lock') }}
      - name: Run fixture-free preprocessor tests
        id: tests
        continue-on-error: true
        working-directory: product/preprocessor
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo nextest run --workspace --profile ci
      - name: Run preprocessor doctests
        id: doctests
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: product/preprocessor
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: cargo test --workspace --doc
      - name: Report individual tests
        if: ${{ always() }}
        run: python3 tools/ci/junit_summary.py --title "Rust preprocessors" "product/preprocessor/target/nextest/ci/junit.xml"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-preprocessor-test-results
          path: product/preprocessor/target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce test results
        if: ${{ steps.tests.outcome == 'failure' || steps.doctests.outcome == 'failure' }}
        run: exit 1

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    env:
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      AEROBAG_ARTIFACT_READ_PATH: ${{ github.workspace }}/.ci/no-artifacts
      AEROBAG_JUNIT_PATH: ${{ github.workspace }}/test-results/web/junit.xml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
      - name: Cache WebAssembly build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/shared/rust-target
          key: web-rust-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/core-rust/Cargo.lock') }}
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("ui/core-rust/Cargo.lock").read_text())
          print(next(package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"))
          PY
          )"
          current="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [[ "$current" != "$version" ]]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Build and test web
        run: |
          mkdir -p "$(dirname "$AEROBAG_JUNIT_PATH")"
          npm --prefix ui/web-app run ci
      - name: Verify generated sources are current
        run: git diff --exit-code -- ui/web-app/src/generated
      - name: Report individual tests
        if: ${{ always() }}
        run: python3 tools/ci/junit_summary.py --title "Web unit tests" "test-results/web/junit.xml"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: test-results/web/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  android-jvm:
    name: Android JVM and static tests
    runs-on: ubuntu-latest
    env:
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      ANDROID_BUILD_NATIVE_LIBRARIES: "false"
      AEROBAG_ANDROID_KEYSTORE: ${{ github.workspace }}/.ci/android-ci.keystore
      AEROBAG_ANDROID_KEYSTORE_PASSWORD: android
      AEROBAG_ANDROID_KEY_ALIAS: androiddebugkey
      AEROBAG_ANDROID_KEY_PASSWORD: android
      AEROBAG_ARTIFACT_READ_PATH: ${{ github.workspace }}/.ci/no-artifacts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .ci/ui-target/android/gradle-user-home/caches
            .ci/ui-target/android/gradle-user-home/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('ui/android-app/**/*.gradle*', 'ui/android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - name: Create CI signing key
        run: |
          mkdir -p .ci
          keytool -genkeypair -keystore "$AEROBAG_ANDROID_KEYSTORE" \
            -storepass "$AEROBAG_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$AEROBAG_ANDROID_KEY_ALIAS" \
            -keypass "$AEROBAG_ANDROID_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Aerobag CI,OU=CI,O=Aerobag,C=US"
      - name: Run Android JVM and static tests
        run: ./ui/android-app/scripts/test.sh testDebugUnitTest
      - name: Report individual tests
        if: ${{ always() }}
        run: python3 tools/ci/junit_summary.py --title "Android JVM tests" ".ci/ui-target/android/build/app/test-results/**/TEST-*.xml"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-results
          path: .ci/ui-target/android/build/app/test-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  python:
    name: Python tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-gdal python3-numpy python3-pytest
      - name: Run Python tests
        run: |
          mkdir -p test-results/python
          /usr/bin/python3 -m pytest \
            tools/test_admin_index.py \
            tools/test_chart_cutline_editor.py \
            tools/ci/test_junit_summary.py \
            product/preprocessor/scripts/test_build_multi_version_publication.py \
            product/preprocessor/scripts/test_pipeline_health.py \
            product/preprocessor/scripts/test_watch_build_log.py \
            --junitxml=test-results/python/junit.xml
      - name: Report individual tests
        if: ${{ always() }}
        run: python3 tools/ci/junit_summary.py --title "Python tool tests" "test-results/python/junit.xml"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/python/junit.xml
          if-no-files-found: ignore
          retention-days: 14
