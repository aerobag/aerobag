<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/icons/page-home-icon.png?v=20260617a" />
    <title>Aerobag</title>
    <style>
      :root {
        color-scheme: dark;
        --startup-bg-top: #071521;
        --startup-bg-bottom: #8fb8db;
        --startup-ink: #d8e7f3;
        --startup-accent: #89d0ff;
        --startup-muted: rgba(216, 231, 243, 0.72);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          linear-gradient(
            180deg,
            var(--startup-bg-top) 0%,
            #0a1b2b 8%,
            #14314a 18%,
            #2c5678 34%,
            #5f8db4 58%,
            var(--startup-bg-bottom) 100%
          );
      }

      body {
        color: var(--startup-ink);
        font-family: "Inter", "Segoe UI", sans-serif;
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--startup-ink);
        background:
          radial-gradient(circle at top, rgba(137, 208, 255, 0.14), transparent 38%),
          linear-gradient(
            180deg,
            var(--startup-bg-top) 0%,
            #0a1b2b 8%,
            #14314a 18%,
            #2c5678 34%,
            #5f8db4 58%,
            var(--startup-bg-bottom) 100%
          );
        z-index: 9999;
      }

      #startup-shell,
      #startup-shell * {
        box-sizing: border-box;
      }

      #startup-shell.is-hidden {
        display: none;
        pointer-events: none;
      }

      .startup-card {
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 28px 32px;
      }

      .startup-logoBox {
        position: relative;
        width: min(68vw, 420px);
      }

      .startup-logo {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.28));
      }

      .startup-spinnerAnchor {
        position: absolute;
        left: 48.855%;
        top: 57.117%;
        width: 13.147%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
      }

      .startup-spinner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid rgba(216, 231, 243, 0.18);
        border-top-color: var(--startup-accent);
        animation: startup-spin 880ms linear infinite;
      }

      .startup-copy {
        font-size: 13px;
        color: var(--startup-muted);
        letter-spacing: 0.04em;
      }

      #startup-shell.has-error .startup-spinner {
        animation: none;
        border-color: rgba(255, 226, 204, 0.26);
        border-top-color: #ffb07c;
      }

      #startup-shell.has-error .startup-copy {
        display: grid;
        gap: 6px;
        max-width: min(82vw, 560px);
        text-align: center;
        color: #ffe2cc;
      }

      .startup-errorTitle {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .startup-errorDetail {
        font-size: 12px;
        line-height: 1.45;
        letter-spacing: normal;
      }

      .startup-elapsed {
        position: fixed;
        right: 18px;
        bottom: 14px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        color: rgba(7, 21, 33, 0.78);
      }

      @keyframes startup-spin {
        to {
          transform: rotate(-360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-shell" aria-hidden="true">
      <div class="startup-card">
        <div class="startup-logoBox">
          <img class="startup-logo" src="/logo.svg" alt="Aerobag" />
          <div class="startup-spinnerAnchor">
            <div class="startup-spinner"></div>
          </div>
        </div>
        <div class="startup-copy">Loading charts and navigation data…</div>
      </div>
      <div id="startup-elapsed" class="startup-elapsed">0.0s</div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        const storageKey = "aerobag.web.debugLogToDeveloperServer.v1";
        const params = new URLSearchParams(window.location.search);
        const hasDeveloperLogFlag = params.has("debugLogToDeveloperServer");
        const hasLegacyDebugLogFlag = params.has("debugLog");
        const requestedValue = hasDeveloperLogFlag
          ? params.get("debugLogToDeveloperServer")
          : hasLegacyDebugLogFlag
            ? params.get("debugLog")
            : null;
        const explicitEnable = requestedValue === "" || /^(1|true|yes|on)$/i.test(String(requestedValue));
        const explicitDisable = /^(0|false|no|off)$/i.test(String(requestedValue));
        try {
          if (explicitEnable) {
            window.localStorage.setItem(storageKey, "1");
          } else if (explicitDisable) {
            window.localStorage.setItem(storageKey, "0");
          }
        } catch {
          // Losing persistence here should not change startup behavior.
        }
        let uploadEnabled = explicitEnable;
        try {
          uploadEnabled = uploadEnabled || window.localStorage.getItem(storageKey) === "1";
        } catch {
          // Keep the URL flag useful even when storage is unavailable.
        }
        if (!uploadEnabled) {
          return;
        }
        const cryptoApi = window.crypto;
        const browserInstanceId = window.__aerobagBrowserInstanceId
          || (cryptoApi && cryptoApi.randomUUID
            ? cryptoApi.randomUUID()
            : "browser-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10));
        const runId = params.get("debugRunId") || ("startup-" + Date.now().toString(36));
        window.__aerobagBrowserInstanceId = browserInstanceId;
        window.__aerobagDebugLogEnabled = true;
        window.__aerobagPerfRunId = runId;
        let startupSeq = 0;
        let startupDebugFlushTimer = null;
        const startupDebugQueue = [];
        function flushStartupDebugLog() {
          startupDebugFlushTimer = null;
          if (startupDebugQueue.length === 0) {
            return;
          }
          const payload = JSON.stringify(startupDebugQueue.splice(0, startupDebugQueue.length));
          try {
            if (
              navigator.sendBeacon
              && navigator.sendBeacon("/__debug_log", new Blob([payload], { type: "application/json" }))
            ) {
              return;
            }
          } catch {
            // Fall through to fetch.
          }
          try {
            fetch("/__debug_log", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: payload,
              keepalive: true,
            });
          } catch {
            // Startup diagnostics must not affect app loading.
          }
        }
        window.__aerobagStartupDebugLog = function (tag, data) {
          startupDebugQueue.push({
            seq: ++startupSeq,
            ts_ms: Math.round(performance.now()),
            tag: tag,
            browser_instance_id: browserInstanceId,
            run_id: runId,
            data: data,
          });
          if (startupDebugFlushTimer == null) {
            startupDebugFlushTimer = window.setTimeout(flushStartupDebugLog, 100);
          }
        };
        window.addEventListener("pagehide", flushStartupDebugLog);
        window.addEventListener("beforeunload", flushStartupDebugLog);
        window.__aerobagStartupDebugLog("startup.html.debug_log.enabled", {
          href: window.location.href,
          userAgent: navigator.userAgent,
        });
      })();
      window.__aerobag_html_start = performance.now();
      window.__aerobagStartupDebugLog?.("startup.html.start", {
        html_start_ms: window.__aerobag_html_start,
      });
      window.__aerobag_startup_cache_warm = (function () {
        const startedAtMs = performance.now();
        const packagesRoot = new URL("/packages/", window.location.origin);
        const state = {
          started_at_ms: Math.round(startedAtMs),
          status: "running",
          resource_count: 0,
          resource_urls: [],
          fetches: [],
        };
        function finish(status, extra) {
          state.status = status;
          state.done_at_ms = Math.round(performance.now());
          state.elapsed_ms = Math.round(performance.now() - startedAtMs);
          if (extra) {
            Object.assign(state, extra);
          }
          window.__aerobagStartupDebugLog?.("startup.html.cache_warm.done", {
            status: state.status,
            elapsed_ms: state.elapsed_ms,
            resource_count: state.resource_count,
            failed_count: state.failed_count || 0,
            status_code: state.status_code || null,
            error: state.error || null,
          });
          return state;
        }
        function selectStartupPrefetchCycle(prefetch) {
          const cycles = prefetch && Array.isArray(prefetch.cycle_resources)
            ? prefetch.cycle_resources
            : [];
          const today = new Date().toISOString().slice(0, 10);
          const active = cycles.find(function (cycle) {
            return typeof cycle.start_valid === "string"
              && typeof cycle.end_valid === "string"
              && cycle.start_valid <= today
              && today < cycle.end_valid;
          });
          if (active) {
            return active;
          }
          const past = cycles
            .filter(function (cycle) {
              return typeof cycle.start_valid === "string" && cycle.start_valid <= today;
            })
            .sort(function (left, right) {
              return String(left.start_valid).localeCompare(String(right.start_valid));
            });
          return past[past.length - 1] || cycles[0] || null;
        }
        function manifestIsSupported(manifest) {
          const contracts = manifest && manifest.contracts && typeof manifest.contracts === "object"
            ? manifest.contracts
            : null;
          const requiredContracts = __AEROBAG_PRODUCT_CONTRACTS__;
          const entries = contracts ? Object.entries(contracts) : [];
          return entries.length > 0
            && entries.every(function (entry) {
              return requiredContracts[entry[0]] === entry[1];
            });
        }
        function selectSupportedManifest(manifests) {
          const supported = manifests
            .filter(manifestIsSupported)
            .sort(function (left, right) {
              return String(left.as_of_utc || "").localeCompare(String(right.as_of_utc || ""));
            });
          return supported[supported.length - 1] || null;
        }
        function withNavKvCacheKey(url) {
          if (url.indexOf("/nav_db_") === -1) {
            return url;
          }
          return url + (url.indexOf("?") === -1 ? "?" : "&") + "v=" + encodeURIComponent(url);
        }
        state.promise = fetch(new URL("current_artifacts.json", packagesRoot), { cache: "no-cache" })
          .then(function (response) {
            if (!response.ok) {
              return finish("current_artifacts_http_error", { status_code: response.status });
            }
            return response.json();
          })
          .then(function (manifests) {
            if (!Array.isArray(manifests)) {
              return finish("current_artifacts_not_list", {});
            }
            const manifest = selectSupportedManifest(manifests);
            if (!manifest) {
              return finish("current_artifacts_no_supported_manifest", {});
            }
            const selectedCycle = selectStartupPrefetchCycle(manifest.startup_prefetch);
            const resources = selectedCycle && Array.isArray(selectedCycle.resources)
              ? selectedCycle.resources
              : [];
            state.selected_cycle = selectedCycle ? {
              bundle_id: selectedCycle.bundle_id,
              cycle: selectedCycle.cycle,
              cycle_version: selectedCycle.cycle_version,
              start_valid: selectedCycle.start_valid,
              end_valid: selectedCycle.end_valid,
            } : null;
            const urls = resources
              .map(function (resource) {
                return resource && typeof resource.url === "string"
                  ? withNavKvCacheKey(new URL(resource.url, packagesRoot).toString())
                  : null;
              })
              .filter(Boolean);
            state.resource_count = urls.length;
            state.resource_urls = urls;
            if (urls.length === 0) {
              return finish("empty");
            }
            return Promise.allSettled(urls.map(function (url) {
              const fetchStartedAtMs = performance.now();
              return fetch(url, { cache: "force-cache" }).then(function (response) {
                return {
                  url: url,
                  ok: response.ok,
                  status: response.status,
                  elapsed_ms: Math.round(performance.now() - fetchStartedAtMs),
                };
              });
            })).then(function (results) {
              const fetches = results.map(function (result, index) {
                if (result.status === "fulfilled") {
                  return result.value;
                }
                return {
                  url: urls[index],
                  ok: false,
                  status: 0,
                  elapsed_ms: null,
                  error: result.reason && result.reason.message ? result.reason.message : String(result.reason),
                };
              });
              const failed = fetches.filter(function (fetchResult) {
                return !fetchResult.ok;
              }).length;
              return finish(failed === 0 ? "done" : "resource_errors", {
                fetches: fetches,
                failed_count: failed,
              });
            });
          })
          .catch(function (error) {
            return finish("error", {
              error: error && error.message ? error.message : String(error),
            });
          });
        return state;
      })();
      (function () {
        const shell = document.getElementById("startup-shell");
        const copyNode = shell ? shell.querySelector(".startup-copy") : null;
        const elapsedNode = document.getElementById("startup-elapsed");
        window.__aerobagStartupDebugLog?.("startup.html.shell.ready", {});
        function renderElapsed() {
          if (!elapsedNode) {
            return;
          }
          const elapsedSeconds = Math.max(0, (performance.now() - window.__aerobag_html_start) / 1000);
          elapsedNode.textContent = elapsedSeconds.toFixed(1) + "s";
        }

        function showStartupShellError(message, detail) {
          if (!shell || !copyNode || shell.classList.contains("is-hidden")) {
            return;
          }
          window.__aerobagStartupDebugLog?.("startup.html.error_shown", {
            message: message,
            detail: detail || null,
            elapsed_ms: Math.round(performance.now() - window.__aerobag_html_start),
          });
          shell.classList.add("has-error");
          copyNode.replaceChildren();
          const title = document.createElement("div");
          title.className = "startup-errorTitle";
          title.textContent = message;
          const detailNode = document.createElement("div");
          detailNode.className = "startup-errorDetail";
          detailNode.textContent = detail || "The web app did not finish mounting. Check the Vite server and browser console.";
          copyNode.append(title, detailNode);
        }

        window.__aerobag_show_startup_shell_error = showStartupShellError;
        window.__aerobag_mark_startup_shell_managed = function () {
          window.__aerobagStartupDebugLog?.("startup.html.shell.managed", {
            elapsed_ms: Math.round(performance.now() - window.__aerobag_html_start),
          });
          if (window.__aerobag_startup_watchdog != null) {
            window.clearTimeout(window.__aerobag_startup_watchdog);
            window.__aerobag_startup_watchdog = undefined;
          }
        };
        window.addEventListener("error", function (event) {
          window.__aerobagStartupDebugLog?.("startup.html.window_error", {
            message: event.message || null,
            filename: event.filename || null,
            lineno: event.lineno || null,
            colno: event.colno || null,
          });
          showStartupShellError(
            "Startup failed",
            event.message || "The browser failed while loading Aerobag.",
          );
        });
        window.addEventListener("unhandledrejection", function (event) {
          const reason = event.reason;
          const detail = reason && reason.message ? reason.message : String(reason || "Unhandled startup rejection");
          window.__aerobagStartupDebugLog?.("startup.html.unhandled_rejection", {
            detail: detail,
          });
          showStartupShellError("Startup failed", detail);
        });
        window.__aerobag_startup_watchdog = window.setTimeout(function () {
          window.__aerobagStartupDebugLog?.("startup.html.watchdog", {
            elapsed_ms: Math.round(performance.now() - window.__aerobag_html_start),
          });
          showStartupShellError(
            "Startup timed out",
            "Aerobag loaded the HTML shell, but the app JavaScript did not report that it mounted.",
          );
        }, 45000);

        renderElapsed();
        if (elapsedNode) {
          window.__aerobag_startup_elapsed_interval = window.setInterval(renderElapsed, 100);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
