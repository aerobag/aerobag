name: End-to-end CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.94.1
  RUSTUP_TOOLCHAIN: 1.94.1

jobs:
  android-native:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - android.flight-plan-route-smoke
          - android.plate-first-render-smoke
          - android.map-follow-ctr-gesture-smoke
          - android.layer-toggle-navdb-regression
    env:
      AEROBAG_TEST_ARTIFACTS_ROOT: ${{ github.workspace }}/.ci/test-artifacts
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      ANDROID_TARGET_ABIS: x86_64
      AEROBAG_ANDROID_KEYSTORE: ${{ github.workspace }}/.ci/android-ci.keystore
      AEROBAG_ANDROID_KEYSTORE_PASSWORD: android
      AEROBAG_ANDROID_KEY_ALIAS: androiddebugkey
      AEROBAG_ANDROID_KEY_PASSWORD: android
      PACKAGE_SOURCE_PORT: 18093
      VNC_PORT: 5900
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and verify compact package publication
        run: |
          python3 tools/ci/fetch_test_artifacts.py \
            --fixture android-smoke-publication \
            --destination "$AEROBAG_TEST_ARTIFACTS_ROOT"
          python3 tools/ci/verify_nav_db_fixture_contracts.py \
            --fixture-root "$AEROBAG_TEST_ARTIFACTS_ROOT" \
            --fixture android-smoke-publication
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install plate screenshot analyzer
        if: ${{ matrix.test == 'android.plate-first-render-smoke' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pil
      - name: Install Rust Android target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add x86_64-linux-android --toolchain "$RUST_TOOLCHAIN"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install emulator, image, platform, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "system-images;android-34;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Create CI signing key
        run: |
          mkdir -p .ci
          keytool -genkeypair -keystore "$AEROBAG_ANDROID_KEYSTORE" \
            -storepass "$AEROBAG_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$AEROBAG_ANDROID_KEY_ALIAS" \
            -keypass "$AEROBAG_ANDROID_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Aerobag CI,OU=CI,O=Aerobag,C=US"
      - name: Cache Android and Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/android/gradle-user-home/caches
            .ci/ui-target/android/gradle-user-home/wrapper
            .ci/ui-target/shared/rust-target
          key: android-e2e-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/android-app/**/*.gradle*', 'ui/android-app/gradle/wrapper/gradle-wrapper.properties', 'ui/core-rust/Cargo.lock', 'test-artifacts.lock.json') }}
          restore-keys: |
            android-e2e-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Run ${{ matrix.test }}
        env:
          CI: "1"
          KEEP_EMULATOR: "0"
          EMULATOR_HEADLESS: "1"
          AEROBAG_ARTIFACT_READ_PATH: ${{ env.AEROBAG_TEST_ARTIFACTS_ROOT }}/e2e/android-smoke-publication/published
          AEROBAG_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/${{ matrix.test }}
        run: >-
          ./ui/android-app/scripts/run_e2e_ci.sh
          --headless
          --skip-system-image-install
          --test "${{ matrix.test }}"
      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test }}-results
          path: |
            test-results/${{ matrix.test }}
            .ci/ui-target/android/emulator-stack-5900
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  android-chrome-live-feed:
    name: android.chrome.live-feed-network-recovery
    runs-on: ubuntu-latest
    env:
      AEROBAG_TEST_ARTIFACTS_ROOT: ${{ github.workspace }}/.ci/test-artifacts
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      VNC_PORT: 5900
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and verify compact package publication
        run: |
          python3 tools/ci/fetch_test_artifacts.py \
            --fixture android-smoke-publication \
            --destination "$AEROBAG_TEST_ARTIFACTS_ROOT"
          python3 tools/ci/verify_nav_db_fixture_contracts.py \
            --fixture-root "$AEROBAG_TEST_ARTIFACTS_ROOT" \
            --fixture android-smoke-publication
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
      - name: Cache WebAssembly build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/shared/rust-target
          key: android-chrome-web-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/core-rust/Cargo.lock', 'ui/web-app/package-lock.json') }}
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("ui/core-rust/Cargo.lock").read_text())
          print(next(package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"))
          PY
          )"
          current="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [[ "$current" != "$version" ]]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install emulator and Google APIs image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run Chrome-on-Android recovery journey
        env:
          CI: "1"
          KEEP_EMULATOR: "0"
          EMULATOR_HEADLESS: "1"
          AEROBAG_ARTIFACT_READ_PATH: ${{ env.AEROBAG_TEST_ARTIFACTS_ROOT }}/e2e/android-smoke-publication/published
          AEROBAG_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/android.chrome.live-feed-network-recovery
        run: ./ui/web-app/scripts/run_android_chrome_livefeed_e2e.sh --headless --json
      - name: Upload emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-chrome-live-feed-results
          path: |
            test-results/android.chrome.live-feed-network-recovery
            .ci/ui-target/android/emulator-stack-5900
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  web-nav-db-rollover:
    name: web.nav-db-rollover
    runs-on: ubuntu-latest
    env:
      AEROBAG_TEST_ARTIFACTS_ROOT: ${{ github.workspace }}/.ci/test-artifacts
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and verify NAVDB transition fixture
        run: |
          python3 tools/ci/fetch_test_artifacts.py \
            --fixture nav-db-advance \
            --destination "$AEROBAG_TEST_ARTIFACTS_ROOT"
          python3 tools/ci/verify_nav_db_fixture_contracts.py \
            --fixture-root "$AEROBAG_TEST_ARTIFACTS_ROOT" \
            --fixture nav-db-advance
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
      - name: Cache WebAssembly build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/shared/rust-target
          key: nav-db-rollover-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/core-rust/Cargo.lock', 'ui/web-app/package-lock.json', 'product/preprocessor/Cargo.lock') }}
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("ui/core-rust/Cargo.lock").read_text())
          print(next(package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"))
          PY
          )"
          current="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [[ "$current" != "$version" ]]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Run headless NAVDB rollover journeys
        run: >-
          npm --prefix ui/web-app run e2e:nav-db-rollover --
          --no-record
          --artifact-root "${{ github.workspace }}/test-results/nav-db-rollover"
          --run-id ci
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-nav-db-rollover-results
          path: test-results/nav-db-rollover
          if-no-files-found: ignore
          retention-days: 14
