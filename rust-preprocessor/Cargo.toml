[workspace]
members = [ "preprocessor-charts",
  "preprocessor-cli",
  "preprocessor-csup",
  "preprocessor-core",
  "preprocessor-fetch",
  "preprocessor-tpp",
  "preprocessor-tools",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
roxmltree = "0.20"
