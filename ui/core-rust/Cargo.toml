[workspace]
members = [
    "crates/app-core",
    "crates/app-ffi",
    "crates/app-wasm",
    "crates/app-fixtures",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
flate2 = "1.1"
lzma-rs = "0.3"
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
wasm-bindgen = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.wasm-perf]
inherits = "release"
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
