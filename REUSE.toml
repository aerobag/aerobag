SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
  "product/chart-metadata/ENR_A/**/*.geojson",
  "product/chart-metadata/ENR_H/**/*.geojson",
  "product/chart-metadata/ENR_L/**/*.geojson",
  "product/chart-metadata/FLY/**/*.geojson",
  "product/chart-metadata/HEL/**/*.geojson",
  "product/chart-metadata/SEC/**/*.geojson",
  "product/chart-metadata/TAC/**/*.geojson",
]
