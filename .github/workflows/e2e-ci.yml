name: End-to-end CI
run-name: ${{ github.ref_type == 'tag' && format('Release qualification {0}', github.ref_name) || format('E2E {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
    tags:
      - "20*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.94.1
  RUSTUP_TOOLCHAIN: 1.94.1

jobs:
  build-release-apps:
    name: Build release E2E apps
    runs-on: ubuntu-latest
    env:
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      ANDROID_TARGET_ABIS: x86_64
      AEROBAG_ANDROID_KEYSTORE: ${{ github.workspace }}/.ci/android-ci.keystore
      AEROBAG_ANDROID_KEYSTORE_PASSWORD: android
      AEROBAG_ANDROID_KEY_ALIAS: androiddebugkey
      AEROBAG_ANDROID_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix ui/web-app
      - name: Install Rust targets
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown x86_64-linux-android --toolchain "$RUST_TOOLCHAIN"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"
      - name: Create CI signing key
        run: |
          mkdir -p .ci
          keytool -genkeypair -keystore "$AEROBAG_ANDROID_KEYSTORE" \
            -storepass "$AEROBAG_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$AEROBAG_ANDROID_KEY_ALIAS" \
            -keypass "$AEROBAG_ANDROID_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Aerobag CI,OU=CI,O=Aerobag,C=US"
      - name: Cache release app builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/tools
            .ci/ui-target/android/gradle-user-home/caches
            .ci/ui-target/android/gradle-user-home/wrapper
            .ci/ui-target/services
            .ci/ui-target/shared/rust-target
          key: release-e2e-apps-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/android-app/**/*.gradle*', 'ui/android-app/gradle/wrapper/gradle-wrapper.properties', 'ui/core-rust/Cargo.lock', 'ui/web-app/package-lock.json') }}
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("ui/core-rust/Cargo.lock").read_text())
          print(next(package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"))
          PY
          )"
          current="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [[ "$current" != "$version" ]]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Install pinned Binaryen
        run: ./ui/web-app/scripts/install-binaryen-wasm-opt.sh
      - name: Build immutable web and Android apps
        run: ./tools/ci/build_release_e2e_apps.sh "${{ github.workspace }}/.ci/release-e2e-apps"
      - name: Upload immutable apps
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-apps-${{ github.sha }}
          path: .ci/release-e2e-apps
          if-no-files-found: error
          retention-days: 14

  release-journey-fixture:
    name: Pin release-journey fixture
    runs-on: ubuntu-latest
    outputs:
      priorities: ${{ steps.priorities.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: priorities
        name: Select journey priorities
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$EVENT_NAME" in
            schedule|workflow_dispatch) value='["p0","p1","p2"]' ;;
            push) [[ "$REF_TYPE" == "tag" ]] && value='["p0","p1","p2"]' || value='["p0"]' ;;
            *) value='["p0"]' ;;
          esac
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Fetch and verify release-journey publication
        run: >-
          python3 tools/ci/fetch_test_artifacts.py
          --fixture release-journey-publication
          --destination "${{ github.workspace }}/.ci/release-journey-source"
      - name: Upload immutable fixture
        uses: actions/upload-artifact@v4
        with:
          name: release-journey-fixture-${{ github.sha }}
          path: .ci/release-journey-source/e2e/release-journey-publication
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release-journey-web:
    name: release journeys / web / ${{ matrix.priority }}
    needs:
      - build-release-apps
      - release-journey-fixture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        priority: ${{ fromJSON(needs.release-journey-fixture.outputs.priorities) }}
    env:
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      AEROBAG_RELEASE_JOURNEY_FIXTURE: ${{ github.workspace }}/.ci/release-journey-materialized/fixture.json
      AEROBAG_RELEASE_JOURNEY_WEB_DIST: ${{ github.workspace }}/.ci/release-e2e-apps/web-dist
      AEROBAG_RELEASE_JOURNEY_SERVE_WEB_DIST: "1"
      AEROBAG_RELEASE_JOURNEY_IMPLEMENTATIONS_ONLY: "1"
      AEROBAG_E2E_URL: http://127.0.0.1:18093/
      AEROBAG_E2E_PEER_URL: http://127.0.0.1:18093/
      AEROBAG_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/release-journey-web-${{ matrix.priority }}
      PACKAGE_SOURCE_PORT: 18093
      AEROBAG_E2E_CLOUD_PORT: 18094
      AEROBAG_CLOUD_SERVER_BIN: ${{ github.workspace }}/.ci/release-e2e-apps/aerobag-cloud-serverd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install browser harness dependencies
        run: npm ci --prefix ui/web-app
      - name: Download immutable apps
        uses: actions/download-artifact@v5
        with:
          name: release-e2e-apps-${{ github.sha }}
          path: .ci/release-e2e-apps
      - name: Restore executable build artifact mode
        run: chmod +x .ci/release-e2e-apps/aerobag-cloud-serverd
      - name: Download release-journey fixture
        uses: actions/download-artifact@v5
        with:
          name: release-journey-fixture-${{ github.sha }}
          path: .ci/release-journey-source
      - name: Materialize static publication
        run: >-
          python3 tools/ci/materialize_release_journey_fixture.py
          --source "${{ github.workspace }}/.ci/release-journey-source"
          --output "${{ github.workspace }}/.ci/release-journey-materialized"
      - name: Start deterministic publication and web app
        run: ./tools/e2e/release_journey_lab.sh fixture-start-web fresh
      - name: Run web ${{ matrix.priority }} journeys
        run: ./tools/e2e/release_journey_lab.sh web-suite "${{ matrix.priority }}"
      - name: Stop journey services
        if: ${{ always() }}
        run: |
          ./tools/e2e/release_journey_lab.sh fixture-stop
          ./tools/e2e/release_journey_lab.sh cloud-stop
      - name: Upload web journey diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-journey-web-${{ matrix.priority }}-results
          path: test-results/release-journey-web-${{ matrix.priority }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  release-journey-android:
    name: release journeys / android / ${{ matrix.priority }}
    needs:
      - build-release-apps
      - release-journey-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        priority: ${{ fromJSON(needs.release-journey-fixture.outputs.priorities) }}
    env:
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      AEROBAG_RELEASE_JOURNEY_FIXTURE: ${{ github.workspace }}/.ci/release-journey-materialized/fixture.json
      AEROBAG_RELEASE_JOURNEY_WEB_DIST: ${{ github.workspace }}/.ci/release-e2e-apps/web-dist
      AEROBAG_RELEASE_JOURNEY_SERVE_WEB_DIST: "1"
      AEROBAG_RELEASE_JOURNEY_IMPLEMENTATIONS_ONLY: "1"
      AEROBAG_E2E_URL: http://127.0.0.1:18093/
      AEROBAG_E2E_PEER_URL: http://127.0.0.1:18093/
      AEROBAG_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/release-journey-android-${{ matrix.priority }}
      PACKAGE_SOURCE_PORT: 18093
      AEROBAG_E2E_CLOUD_PORT: 18094
      AEROBAG_CLOUD_SERVER_BIN: ${{ github.workspace }}/.ci/release-e2e-apps/aerobag-cloud-serverd
      AVD_PACKAGE_PATH: system-images;android-34;aosp_atd;x86_64
      VNC_PORT: 5900
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install browser harness dependencies
        run: npm ci --prefix ui/web-app
      - name: Download immutable apps
        uses: actions/download-artifact@v5
        with:
          name: release-e2e-apps-${{ github.sha }}
          path: .ci/release-e2e-apps
      - name: Restore executable build artifact mode
        run: chmod +x .ci/release-e2e-apps/aerobag-cloud-serverd
      - name: Download release-journey fixture
        uses: actions/download-artifact@v5
        with:
          name: release-journey-fixture-${{ github.sha }}
          path: .ci/release-journey-source
      - name: Materialize static publication
        run: >-
          python3 tools/ci/materialize_release_journey_fixture.py
          --source "${{ github.workspace }}/.ci/release-journey-source"
          --output "${{ github.workspace }}/.ci/release-journey-materialized"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "$AVD_PACKAGE_PATH"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Start deterministic publication and web peer
        run: ./tools/e2e/release_journey_lab.sh fixture-start-web fresh
      - name: Clean-install immutable APK and sync packages
        env:
          CI: "1"
          KEEP_EMULATOR: "1"
          EMULATOR_HEADLESS: "1"
        run: >-
          ./ui/android-app/scripts/run_e2e_ci.sh
          --headless
          --keep-emulator
          --skip-system-image-install
          --no-package-server
          --apk "${{ github.workspace }}/.ci/release-e2e-apps/aerobag-release-e2e.apk"
          --release-fixture "$AEROBAG_RELEASE_JOURNEY_FIXTURE"
          --test shared.startup-navigation
      - name: Run Android ${{ matrix.priority }} journeys
        run: ./tools/e2e/release_journey_lab.sh android-suite "${{ matrix.priority }}"
      - name: Stop Android and journey services
        if: ${{ always() }}
        run: |
          ./ui/android-app/scripts/stop_emulator_stack.sh
          ./tools/e2e/release_journey_lab.sh fixture-stop
          ./tools/e2e/release_journey_lab.sh cloud-stop
      - name: Upload Android journey diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-journey-android-${{ matrix.priority }}-results
          path: |
            test-results/release-journey-android-${{ matrix.priority }}
            .ci/ui-target/android/emulator-stack-5900
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  android-native:
    name: ${{ matrix.test }}
    needs: build-release-apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test:
          - android.flight-plan-route-smoke
          - android.plate-first-render-smoke
          - android.map-follow-ctr-gesture-smoke
          - android.layer-toggle-navdb-regression
          - android.rotation-session-retention-regression
    env:
      AEROBAG_TEST_ARTIFACTS_ROOT: ${{ github.workspace }}/.ci/test-artifacts
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      ANDROID_TARGET_ABIS: x86_64
      AEROBAG_ANDROID_KEYSTORE: ${{ github.workspace }}/.ci/android-ci.keystore
      AEROBAG_ANDROID_KEYSTORE_PASSWORD: android
      AEROBAG_ANDROID_KEY_ALIAS: androiddebugkey
      AEROBAG_ANDROID_KEY_PASSWORD: android
      AVD_PACKAGE_PATH: ${{ matrix.test == 'android.plate-first-render-smoke' && 'system-images;android-34;google_apis;x86_64' || 'system-images;android-34;aosp_atd;x86_64' }}
      PACKAGE_SOURCE_PORT: 18093
      VNC_PORT: 5900
    steps:
      - uses: actions/checkout@v5
      - name: Download immutable apps
        uses: actions/download-artifact@v5
        with:
          name: release-e2e-apps-${{ github.sha }}
          path: .ci/release-e2e-apps
      - name: Fetch and verify compact package publication
        run: |
          fixtures=(--fixture android-smoke-publication)
          if [[ "${{ matrix.test }}" == "android.rotation-session-retention-regression" ]]; then
            fixtures+=(--fixture android-rotation-live-feed)
          fi
          python3 tools/ci/fetch_test_artifacts.py \
            "${fixtures[@]}" \
            --destination "$AEROBAG_TEST_ARTIFACTS_ROOT"
          python3 tools/ci/verify_nav_db_fixture_contracts.py \
            --fixture-root "$AEROBAG_TEST_ARTIFACTS_ROOT" \
            --fixture android-smoke-publication
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install plate screenshot analyzer
        if: ${{ matrix.test == 'android.plate-first-render-smoke' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-pil
      - name: Install Rust Android target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add x86_64-linux-android --toolchain "$RUST_TOOLCHAIN"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install emulator, image, platform, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "$AVD_PACKAGE_PATH"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Create CI signing key
        run: |
          mkdir -p .ci
          keytool -genkeypair -keystore "$AEROBAG_ANDROID_KEYSTORE" \
            -storepass "$AEROBAG_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$AEROBAG_ANDROID_KEY_ALIAS" \
            -keypass "$AEROBAG_ANDROID_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Aerobag CI,OU=CI,O=Aerobag,C=US"
      - name: Cache Android and Rust builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/android/gradle-user-home/caches
            .ci/ui-target/android/gradle-user-home/wrapper
            .ci/ui-target/shared/rust-target
          key: android-e2e-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/android-app/**/*.gradle*', 'ui/android-app/gradle/wrapper/gradle-wrapper.properties', 'ui/core-rust/Cargo.lock', 'test-artifacts.lock.json') }}
          restore-keys: |
            android-e2e-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Run ${{ matrix.test }}
        env:
          CI: "1"
          KEEP_EMULATOR: "0"
          EMULATOR_HEADLESS: "1"
          AEROBAG_ARTIFACT_READ_PATH: ${{ env.AEROBAG_TEST_ARTIFACTS_ROOT }}/e2e/android-smoke-publication/published
          AEROBAG_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/${{ matrix.test }}
          AEROBAG_E2E_APK: ${{ github.workspace }}/.ci/release-e2e-apps/aerobag-release-e2e.apk
        run: >-
          ./ui/android-app/scripts/run_e2e_ci.sh
          --headless
          --skip-system-image-install
          --test "${{ matrix.test }}"
      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test }}-results
          path: |
            test-results/${{ matrix.test }}
            .ci/ui-target/android/emulator-stack-5900
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  android-chrome-live-feed:
    name: android.chrome.live-feed-network-recovery
    runs-on: ubuntu-latest
    env:
      AEROBAG_TEST_ARTIFACTS_ROOT: ${{ github.workspace }}/.ci/test-artifacts
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
      VNC_PORT: 5900
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and verify compact package publication
        run: |
          python3 tools/ci/fetch_test_artifacts.py \
            --fixture android-smoke-publication \
            --destination "$AEROBAG_TEST_ARTIFACTS_ROOT"
          python3 tools/ci/verify_nav_db_fixture_contracts.py \
            --fixture-root "$AEROBAG_TEST_ARTIFACTS_ROOT" \
            --fixture android-smoke-publication
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
      - name: Cache WebAssembly build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/shared/rust-target
          key: android-chrome-web-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/core-rust/Cargo.lock', 'ui/web-app/package-lock.json') }}
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("ui/core-rust/Cargo.lock").read_text())
          print(next(package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"))
          PY
          )"
          current="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [[ "$current" != "$version" ]]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install emulator and Google APIs image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run Chrome-on-Android recovery journey
        env:
          CI: "1"
          KEEP_EMULATOR: "0"
          EMULATOR_HEADLESS: "1"
          AEROBAG_ARTIFACT_READ_PATH: ${{ env.AEROBAG_TEST_ARTIFACTS_ROOT }}/e2e/android-smoke-publication/published
          AEROBAG_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-results/android.chrome.live-feed-network-recovery
        run: ./ui/web-app/scripts/run_android_chrome_livefeed_e2e.sh --headless --json
      - name: Upload emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-chrome-live-feed-results
          path: |
            test-results/android.chrome.live-feed-network-recovery
            .ci/ui-target/android/emulator-stack-5900
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  web-nav-db-rollover:
    name: web.nav-db-rollover
    runs-on: ubuntu-latest
    env:
      AEROBAG_TEST_ARTIFACTS_ROOT: ${{ github.workspace }}/.ci/test-artifacts
      AEROBAG_UI_TARGET_ROOT: ${{ github.workspace }}/.ci/ui-target
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and verify NAVDB transition fixture
        run: |
          python3 tools/ci/fetch_test_artifacts.py \
            --fixture nav-db-advance \
            --destination "$AEROBAG_TEST_ARTIFACTS_ROOT"
          python3 tools/ci/verify_nav_db_fixture_contracts.py \
            --fixture-root "$AEROBAG_TEST_ARTIFACTS_ROOT" \
            --fixture nav-db-advance
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web-app/package-lock.json
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
      - name: Cache WebAssembly build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            .ci/ui-target/shared/rust-target
          key: nav-db-rollover-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('ui/core-rust/Cargo.lock', 'ui/web-app/package-lock.json', 'product/preprocessor/Cargo.lock') }}
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("ui/core-rust/Cargo.lock").read_text())
          print(next(package["version"] for package in lock["package"] if package["name"] == "wasm-bindgen"))
          PY
          )"
          current="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}' || true)"
          if [[ "$current" != "$version" ]]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Run headless NAVDB rollover journeys
        run: >-
          npm --prefix ui/web-app run e2e:nav-db-rollover --
          --no-record
          --artifact-root "${{ github.workspace }}/test-results/nav-db-rollover"
          --run-id ci
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-nav-db-rollover-results
          path: test-results/nav-db-rollover
          if-no-files-found: ignore
          retention-days: 14

  qualification-result:
    name: ${{ github.ref_type == 'tag' && 'Release qualification' || 'E2E aggregate' }}
    if: ${{ always() }}
    needs:
      - build-release-apps
      - release-journey-fixture
      - release-journey-web
      - release-journey-android
      - android-native
      - android-chrome-live-feed
      - web-nav-db-rollover
    runs-on: ubuntu-latest
    steps:
      - name: Require every E2E lane
        env:
          BUILD_RELEASE_APPS: ${{ needs.build-release-apps.result }}
          RELEASE_JOURNEY_FIXTURE: ${{ needs.release-journey-fixture.result }}
          RELEASE_JOURNEY_WEB: ${{ needs.release-journey-web.result }}
          RELEASE_JOURNEY_ANDROID: ${{ needs.release-journey-android.result }}
          ANDROID_NATIVE: ${{ needs.android-native.result }}
          ANDROID_CHROME_LIVE_FEED: ${{ needs.android-chrome-live-feed.result }}
          WEB_NAV_DB_ROLLOVER: ${{ needs.web-nav-db-rollover.result }}
        run: |
          failed=0
          for name in \
            BUILD_RELEASE_APPS RELEASE_JOURNEY_FIXTURE RELEASE_JOURNEY_WEB \
            RELEASE_JOURNEY_ANDROID ANDROID_NATIVE ANDROID_CHROME_LIVE_FEED \
            WEB_NAV_DB_ROLLOVER
          do
            result="${!name}"
            printf '%-32s %s\n' "$name" "$result"
            [[ "$result" == "success" ]] || failed=1
          done
          exit "$failed"
