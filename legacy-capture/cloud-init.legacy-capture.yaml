#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - exiftool
  - gdal-bin
  - ghostscript
  - imagemagick
  - jq
  - perl
  - python3
  - python3-bs4
  - python3-elementpath
  - python3-gdal
  - python3-glob2
  - python3-numpy
  - python3-pypdf
  - python3-regex
  - python3-tqdm
  - python3-urllib3
  - sqlite3
  - unzip
  - zip

runcmd:
  - [bash, -lc, "python3 --version"]
  - [bash, -lc, "gdalinfo --version"]
  - [bash, -lc, "gs --version"]
  - [bash, -lc, "exiftool -ver"]
