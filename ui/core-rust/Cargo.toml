[workspace]
members = [
    "crates/app-ui-contracts",
    "crates/app-core",
    "crates/app-ffi",
    "crates/app-wasm",
    "crates/app-fixtures",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
flate2 = "1.1"
getrandom = { version = "0.2", features = ["js"] }
hkdf = "0.12"
ed25519-dalek = "2.1"
lzma-rs = "0.3"
prost = "0.14.4"
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
sha2 = "0.10"
sunrise = "3.0"
thiserror = "1"
wasm-bindgen = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.wasm-perf]
inherits = "release"
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
