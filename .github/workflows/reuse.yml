name: REUSE compliance

on:
  push:
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .reuse-tool-version
      - name: Verify license metadata
        run: |
          python -m pip install "reuse==$(cat .reuse-tool-version)"
          ./scripts/check-licenses.sh
